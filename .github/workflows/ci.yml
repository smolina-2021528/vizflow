name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Pack packages
        run: |
          mkdir -p .artifacts
          pnpm --filter @smolina-dev/vizflow-core pack --pack-destination .artifacts
          pnpm --filter @smolina-dev/vizflow-cli pack --pack-destination .artifacts

      - name: Verify packed package metadata
        run: |
          core_package="$(ls .artifacts/*vizflow-core*.tgz | head -n 1)"
          cli_package="$(ls .artifacts/*vizflow-cli*.tgz | head -n 1)"

          test -n "$core_package"
          test -n "$cli_package"

          tar -xOf "$core_package" package/package.json | grep '"name": "@smolina-dev/vizflow-core"'
          tar -xOf "$cli_package" package/package.json | grep '"name": "@smolina-dev/vizflow-cli"'

          tar -xOf "$core_package" package/package.json | grep '"version": "'
          tar -xOf "$cli_package" package/package.json | grep '"version": "'